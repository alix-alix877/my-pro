<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Kufi+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE7D9;
    --bg-raised:#FBF8F1;
    --ink:#282720;
    --ink-dim:#7C7666;
    --accent:#4E6B4A;
    --accent-soft:#DDE6D6;
    --line:#DDD3BC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #F3EEE0 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Kufi Arabic', sans-serif;
    line-height:1.75;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:90px 24px 130px;
  }
  header{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:88px;
  }
  .avatar{
    width:76px;height:76px;border-radius:50%;
    object-fit:cover;
    border:3px solid var(--bg-raised);
    box-shadow:0 0 0 1px var(--line), 0 6px 16px -8px rgba(40,39,32,.25);
  }
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:clamp(2.1rem,5vw,3rem);
    font-weight:500;
    margin:0;
    letter-spacing:-0.01em;
  }
  .role{
    color:var(--accent);
    font-size:1rem;
    font-weight:600;
    margin-top:2px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .bio{
    color:var(--ink-dim);
    font-size:1.02rem;
    max-width:54ch;
  }
  .links{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .links a{
    color:var(--ink);
    text-decoration:none;
    font-size:.85rem;
    background:var(--bg-raised);
    border:1px solid var(--line);
    padding:8px 18px;
    border-radius:100px;
    transition:background .2s, border-color .2s, transform .15s, box-shadow .2s;
  }
  .links a:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    transform:translateY(-1px);
    box-shadow:0 6px 14px -6px rgba(78,107,74,.5);
  }

  .section-label{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    font-weight:500;
    margin-bottom:6px;
  }
  .count{
    color:var(--ink-dim);
    font-size:.85rem;
    margin-bottom:32px;
  }

  .project{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px;
    margin-bottom:18px;
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    box-shadow:0 4px 18px -12px rgba(40,39,32,.18);
    transition:box-shadow .25s, transform .25s;
  }
  .project:hover{
    box-shadow:0 10px 28px -14px rgba(40,39,32,.28);
    transform:translateY(-2px);
  }
  .project-title{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    font-weight:500;
    margin:0;
  }
  .project-title a{
    color:var(--ink);
    text-decoration:none;
  }
  .project-title a:hover{color:var(--accent);}
  .project-desc{
    color:var(--ink-dim);
    font-size:.95rem;
    max-width:60ch;
  }
  .project-meta{
    display:flex;
    gap:14px;
    align-items:center;
  }
  .project-link{
    font-size:.82rem;
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:100px;
    transition:background .2s;
  }
  .project-link:hover{background:var(--accent);color:#fff;}
  .project-img{
    width:100%;
    max-height:320px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--line);
  }

  .empty{
    color:var(--ink-dim);
    padding:36px;
    background:var(--bg-raised);
    border:1.5px dashed var(--line);
    border-radius:16px;
    font-size:.92rem;
    text-align:center;
  }

  footer{
    margin-top:70px;
    color:var(--ink-dim);
    font-size:.78rem;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header id="profile-header">
      <!-- يُعبأ تلقائياً -->
    </header>

    <div class="section-label">المشاريع</div>
    <div class="count" id="project-count"></div>
    <div id="projects"></div>

    <footer>.....</footer>
  </div>

<script>
async function loadData(){
  try{
    const res = await fetch('data.json?_=' + Date.now());
    const data = await res.json();
    renderProfile(data.profile);
    renderProjects(data.projects || []);
  }catch(e){
    document.getElementById('projects').innerHTML =
      '<div class="empty">تعذّر تحميل البيانات. تأكد من وجود ملف data.json بجانب هذه الصفحة.</div>';
  }
}

function renderProfile(p){
  if(!p) return;
  const header = document.getElementById('profile-header');
  let html = '';
  if(p.avatar) html += `<img class="avatar" src="${escapeAttr(p.avatar)}" alt="">`;
  html += `<h1>${escapeHtml(p.name || 'اسمك هنا')}</h1>`;
  if(p.title) html += `<div class="role">${escapeHtml(p.title)}</div>`;
  if(p.bio) html += `<p class="bio">${escapeHtml(p.bio)}</p>`;

  const links = [];
  if(p.github) links.push(`<a href="${escapeAttr(p.github)}" target="_blank" rel="noopener">GitHub</a>`);
  if(p.linkedin) links.push(`<a href="${escapeAttr(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`);
  if(p.email) links.push(`<a href="mailto:${escapeAttr(p.email)}">راسلني</a>`);
  if(links.length) html += `<div class="links">${links.join('')}</div>`;

  header.innerHTML = html;
}

function renderProjects(list){
  const container = document.getElementById('projects');
  const count = document.getElementById('project-count');
  count.textContent = list.length ? `${list.length} مشروع` : '';

  if(!list.length){
    container.innerHTML = '<div class="empty">لا توجد مشاريع مضافة بعد.</div>';
    return;
  }

  container.innerHTML = list.map(pr => `
    <div class="project">
      <h3 class="project-title">
        ${pr.link ? `<a href="${escapeAttr(pr.link)}" target="_blank" rel="noopener">${escapeHtml(pr.title)}</a>` : escapeHtml(pr.title)}
      </h3>
      ${pr.image ? `<img class="project-img" src="${escapeAttr(pr.image)}" alt="">` : ''}
      ${pr.description ? `<p class="project-desc">${escapeHtml(pr.description)}</p>` : ''}
      ${pr.link ? `<div class="project-meta"><a class="project-link" href="${escapeAttr(pr.link)}" target="_blank" rel="noopener">فتح الرابط ←</a></div>` : ''}
    </div>
  `).join('');
}

function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

loadData();
</script>
</body>
</html>
